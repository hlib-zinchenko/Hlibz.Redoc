name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required to request the OIDC token for NuGet Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test core
        run: dotnet test --project tests/Hlibz.Redoc.Extensions.Core.Tests --no-build --configuration Release

      - name: Test Redoc.AspNetCore adapter
        run: dotnet test --project tests/Hlibz.Redoc.Extensions.RedocAspNetCore.Tests --no-build --configuration Release

      - name: Test Swashbuckle adapter
        run: dotnet test --project tests/Hlibz.Redoc.Extensions.Swashbuckle.Tests --no-build --configuration Release

      - name: Test our host
        run: dotnet test --project tests/Hlibz.Redoc.AspNetCore.Tests --no-build --configuration Release

      - name: Determine package version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Core, both adapters and our own host ship one version, driven by the tag.
      # Every ID here needs its own nuget.org trusted-publishing policy before the first tag
      # that would publish it, or the push fails.
      - name: Pack
        run: |
          for project in \
            src/Hlibz.Redoc.Extensions.Core \
            src/Hlibz.Redoc.Extensions.RedocAspNetCore \
            src/Hlibz.Redoc.Extensions.Swashbuckle \
            src/Hlibz.Redoc.AspNetCore
          do
            dotnet pack "$project" \
              --configuration Release \
              --output ./artifacts \
              -p:Version=${{ steps.version.outputs.value }}
          done

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
