name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --project tests/Hlibz.Redoc.AspNetCore.Extensions.Tests --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/Hlibz.Redoc.AspNetCore.Extensions --no-build --configuration Release --output ./artifacts

      # The README and icon nuget.org shows: at the package root and referenced by the nuspec,
      # since dropping PackageIcon or PackageReadmeFile still packs.
      - name: Package contents
        run: |
          unzip -l ./artifacts/*.nupkg > contents.txt
          cat contents.txt
          grep -qE " README\.md$" contents.txt
          grep -qE " icon\.png$" contents.txt
          unzip -p ./artifacts/*.nupkg '*.nuspec' > package.nuspec
          grep -q "<readme>README.md</readme>" package.nuspec
          grep -q "<icon>icon.png</icon>" package.nuspec
